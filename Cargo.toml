[package]
name = "rust_copy_trader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
helius-laserstream = { version = "0.9.0", default-features = false }
meteora-dlmm = "0.2.0"
orca_whirlpools = "8.0.0"
orca_whirlpools_client = "8.0.0"
pump-rust-client = { version = "0.2.0", default-features = false }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-client = "3.0.8"
solana-account-decoder-client-types = "3.1.14"
solana-clmm-raydium = "0.3.0"
solana-commitment-config = "3.1.1"
solana-compute-budget-interface = "3.1.0"
solana-rpc-client = "3.1.14"
solana-sdk = "3.0.0"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
spl-associated-token-account = "8.0.0"
spl-token = "9.0.0"
spl-token-2022 = "11.1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tracing-appender = "0.2"
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
